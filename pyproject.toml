# Test and lint configuration only. scripts/build_release.py builds the
# wheel pip installs, with no build tool (docs/design.md § The stack, and
# what it rules out), so there is no [build-system] or [project] table,
# and `pip install .` from a checkout does not work.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The run forms put src/frameledger itself on the import path, and the
# tests do the same, so modules import each other by bare name.
pythonpath = ["src/frameledger"]
addopts = ["--strict-markers"]
markers = ["slow: a test of S19's speed; `-m \"not slow\"` skips it, the gate runs it"]
# A deprecation fails the tests, on the floor leg as well as the
# newest-Python one (FLED-0082), so a call a later Python will remove is
# caught; scripts/local-ci.sh passes the same -W to --selftest. A failure
# may come from a dependency rather than frameledger: pin that dependency,
# or add an "ignore::DeprecationWarning:MODULE" entry for it here.
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
# The analyser's floor (docs/design.md § The stack), so the UP rules never
# suggest syntax 3.10 lacks.
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
